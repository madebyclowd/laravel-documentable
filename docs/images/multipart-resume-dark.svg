<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 896" width="960" height="896" role="img" aria-labelledby="multipart-resume-title multipart-resume-desc">
<title id="multipart-resume-title">Multipart upload with resume</title>
<desc id="multipart-resume-desc">Sequence diagram: the browser starts a multipart session, asks for signed part URLs, and uploads the parts straight to the bucket in parallel. If the connection drops it asks which parts are done and continues. It then completes the upload and the app joins the parts and returns the document.</desc>
