name: run-tests

on:
  push:
    branches: [main, '3.x']
  pull_request:
    branches: [main, '3.x']

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Code Styling Check (Pint)
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-lint-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-lint-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run Pint
        run: vendor/bin/pint --test

  shipped-text:
    runs-on: ubuntu-latest
    name: Shipped text (no internal references)
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Comments and docs that ship to Packagist must stand on their own. The same rule is enforced by
      # tests/Unit/ShippedTextTest.php; this step fails fast without installing dependencies.
      - name: Reject references to internal planning documents
        run: |
          if grep -rnEi 'phase[ -]?[0-9]|docs/feedbacks|docs/implementations|bugs\.md|best-practices\.md|missing-features\.md|feedback\.md' src config routes database resources README.md; then
            echo "::error::Shipped files must not point at internal planning documents. Rewrite the match as a self-contained sentence."
            exit 1
          fi

  static-analysis:
    runs-on: ubuntu-latest
    name: Static Analysis (Larastan)
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-stan-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-stan-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run Larastan
        run: composer analyse -- --error-format=github

  strict-types:
    runs-on: ubuntu-latest
    name: Strict types (new and edited files)
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require declare(strict_types=1) in every changed PHP file
        run: bin/check-strict-types.sh "origin/${{ github.base_ref }}"

  audit:
    runs-on: ubuntu-latest
    name: Composer audit
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Audit dependencies for known advisories
        run: composer audit

  backward-compatibility:
    runs-on: ubuntu-latest
    name: Backward compatibility vs 2.x (report only)
    # Report only: v3 breaks the public API on purpose. The report is read in review and its inventory
    # feeds UPGRADE.md. Remove continue-on-error once 3.0.0 is tagged so 3.x is checked against 3.0.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: none

      - name: Install the checker
        run: composer global require roave/backward-compatibility-check --no-interaction

      - name: Compare against the last 2.x release
        run: ~/.composer/vendor/bin/roave-backward-compatibility-check --from=v2.1.3 --to=HEAD --format=github-actions

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `include`-only, no other top-level matrix key: GitHub Actions' matrix
        # merge rule collapses these into a single job if a sibling key (e.g. a
        # top-level `stability: [prefer-stable]`) doesn't share a key with each
        # include entry. That silently happened once: only the last entry ever
        # ran. `stability` therefore lives inside each entry instead of as a
        # separate axis, which is GitHub's documented pattern for a fully custom
        # (non-cartesian) matrix and reliably yields one job per entry.
        #
        # Every PHP x Laravel leg runs on sqlite, mysql and pgsql. The uniqueness and
        # versioning logic and column widths are the parts most likely to pass on
        # sqlite and fail on another engine (sqlite ignores varchar length), so no
        # engine is skipped on any leg. One prefer-lowest leg proves the declared
        # minimum versions in composer.json still work.
        include:
          - php: 8.3
            laravel: 12.*
            testbench: 10.*
            db: sqlite
            stability: prefer-stable
          - php: 8.3
            laravel: 13.*
            testbench: 11.*
            db: sqlite
            stability: prefer-stable
          - php: 8.4
            laravel: 12.*
            testbench: 10.*
            db: sqlite
            stability: prefer-stable
          - php: 8.4
            laravel: 13.*
            testbench: 11.*
            db: sqlite
            stability: prefer-stable
          - php: 8.5
            laravel: 12.*
            testbench: 10.*
            db: sqlite
            stability: prefer-stable
          - php: 8.5
            laravel: 13.*
            testbench: 11.*
            db: sqlite
            stability: prefer-stable
          - php: 8.3
            laravel: 12.*
            testbench: 10.*
            db: mysql
            stability: prefer-stable
          - php: 8.3
            laravel: 13.*
            testbench: 11.*
            db: mysql
            stability: prefer-stable
          - php: 8.4
            laravel: 12.*
            testbench: 10.*
            db: mysql
            stability: prefer-stable
          - php: 8.4
            laravel: 13.*
            testbench: 11.*
            db: mysql
            stability: prefer-stable
          - php: 8.5
            laravel: 12.*
            testbench: 10.*
            db: mysql
            stability: prefer-stable
          - php: 8.5
            laravel: 13.*
            testbench: 11.*
            db: mysql
            stability: prefer-stable
          - php: 8.3
            laravel: 12.*
            testbench: 10.*
            db: pgsql
            stability: prefer-stable
          - php: 8.3
            laravel: 13.*
            testbench: 11.*
            db: pgsql
            stability: prefer-stable
          - php: 8.4
            laravel: 12.*
            testbench: 10.*
            db: pgsql
            stability: prefer-stable
          - php: 8.4
            laravel: 13.*
            testbench: 11.*
            db: pgsql
            stability: prefer-stable
          - php: 8.5
            laravel: 12.*
            testbench: 10.*
            db: pgsql
            stability: prefer-stable
          - php: 8.5
            laravel: 13.*
            testbench: 11.*
            db: pgsql
            stability: prefer-stable
          - php: 8.3
            laravel: 12.*
            testbench: 10.*
            db: sqlite
            stability: prefer-lowest

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.db }} - ${{ matrix.stability }}

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: documentable_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        # Services always start; the DB_CONNECTION env below scopes which matrix
        # legs actually connect to it — inert otherwise.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: documentable_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      rustfs:
        image: rustfs/rustfs:1.0.3
        env:
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
        ports:
          - 9000:9000

    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_DATABASE: documentable_test
      DB_USERNAME: ${{ matrix.db == 'pgsql' && 'postgres' || 'root' }}
      DB_PASSWORD: ${{ matrix.db == 'pgsql' && 'postgres' || '' }}
      RUSTFS_ENDPOINT: http://127.0.0.1:9000
      RUSTFS_BUCKET: documentable-test
      RUSTFS_ACCESS_KEY_ID: rustfsadmin
      RUSTFS_SECRET_ACCESS_KEY: rustfsadmin
      RUSTFS_REGION: us-east-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, pdo_mysql, pdo_pgsql, bcmath, gd, exif, iconv
          # Coverage is collected on exactly one leg — the newest PHP/Laravel
          # combo on sqlite — and uploaded to Codecov below. Every other leg
          # runs with coverage off for speed.
          coverage: ${{ (matrix.php == '8.4' && matrix.laravel == '13.*' && matrix.db == 'sqlite') && 'pcov' || 'none' }}

      - name: Setup Problem Matchers
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Cache Composer Dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.laravel }}-

      - name: Install dependencies
        env:
          COMPOSER_POLICY_ADVISORIES_BLOCK: 0
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Create RustFS test bucket
        run: |
          php -r '
            require "vendor/autoload.php";
            $client = new Aws\S3\S3Client([
                "version" => "latest",
                "region" => "us-east-1",
                "endpoint" => "http://127.0.0.1:9000",
                "use_path_style_endpoint" => true,
                "credentials" => [
                    "key" => "rustfsadmin",
                    "secret" => "rustfsadmin",
                ],
            ]);

            $attempts = 0;
            while ($attempts < 30) {
                try {
                    $client->createBucket(["Bucket" => "documentable-test"]);
                    echo "Bucket documentable-test created.\n";
                    exit(0);
                } catch (\Aws\S3\Exception\S3Exception $e) {
                    if ($e->getAwsErrorCode() === "BucketAlreadyOwnedByYou" || $e->getAwsErrorCode() === "BucketAlreadyExists") {
                        echo "Bucket documentable-test already exists.\n";
                        exit(0);
                    }
                } catch (\Throwable $e) {
                    // Retry on connection error while RustFS boots
                }
                $attempts++;
                sleep(1);
            }
            echo "Could not connect to RustFS or create bucket after 30 attempts.\n";
            exit(1);
          '

      - name: Execute tests
        run: vendor/bin/phpunit ${{ (matrix.php == '8.4' && matrix.laravel == '13.*' && matrix.db == 'sqlite') && '--coverage-clover=coverage.xml' || '' }}

      - name: Upload coverage to Codecov
        if: matrix.php == '8.4' && matrix.laravel == '13.*' && matrix.db == 'sqlite'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
