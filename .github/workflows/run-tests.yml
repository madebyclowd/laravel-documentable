name: run-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Code Styling Check (Pint)
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-lint-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-lint-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run Pint
        run: vendor/bin/pint --test

  static-analysis:
    runs-on: ubuntu-latest
    name: Static Analysis (Larastan)
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-stan-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-stan-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run Larastan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `include`-only, no other top-level matrix key: GitHub Actions' matrix
        # merge rule collapses these into a single job if a sibling key (e.g. a
        # top-level `stability: [prefer-stable]`) doesn't share a key with each
        # include entry — verified this was silently happening (only the last
        # entry, php 8.4/laravel 13.*/pgsql, ever actually ran, since this
        # project's first commit). `stability` now lives inside each entry
        # instead of as a separate axis, which is GitHub's documented pattern
        # for a fully custom (non-cartesian) matrix and reliably yields one job
        # per entry.
        #
        # Full PHP x Laravel matrix runs on sqlite (fast). The uniqueness/
        # versioning logic (package-plan.md §5) is the part most likely to
        # silently pass on one engine and fail on another, so the latest
        # PHP/Laravel combo additionally runs against mysql and pgsql.
        include:
          - php: 8.2
            laravel: 11.*
            testbench: 9.*
            db: sqlite
            stability: prefer-stable
          - php: 8.3
            laravel: 11.*
            testbench: 9.*
            db: sqlite
            stability: prefer-stable
          - php: 8.3
            laravel: 12.*
            testbench: 10.*
            db: sqlite
            stability: prefer-stable
          - php: 8.3
            laravel: 13.*
            testbench: 11.*
            db: sqlite
            stability: prefer-stable
          - php: 8.4
            laravel: 11.*
            testbench: 9.*
            db: sqlite
            stability: prefer-stable
          - php: 8.4
            laravel: 12.*
            testbench: 10.*
            db: sqlite
            stability: prefer-stable
          - php: 8.4
            laravel: 13.*
            testbench: 11.*
            db: sqlite
            stability: prefer-stable
          - php: 8.4
            laravel: 13.*
            testbench: 11.*
            db: mysql
            stability: prefer-stable
          - php: 8.4
            laravel: 13.*
            testbench: 11.*
            db: pgsql
            stability: prefer-stable

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.db }}

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: documentable_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        # Services always start; the DB_CONNECTION env below scopes which matrix
        # legs actually connect to it — inert otherwise.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: documentable_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_DATABASE: documentable_test
      DB_USERNAME: ${{ matrix.db == 'pgsql' && 'postgres' || 'root' }}
      DB_PASSWORD: ${{ matrix.db == 'pgsql' && 'postgres' || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, pdo_mysql, pdo_pgsql, bcmath, gd, exif, iconv
          # Coverage is collected on exactly one leg — the newest PHP/Laravel
          # combo on sqlite — and uploaded to Codecov below. Every other leg
          # runs with coverage off for speed.
          coverage: ${{ (matrix.php == '8.4' && matrix.laravel == '13.*' && matrix.db == 'sqlite') && 'pcov' || 'none' }}

      - name: Setup Problem Matchers
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Cache Composer Dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.laravel }}-

      - name: Install dependencies
        env:
          COMPOSER_POLICY_ADVISORIES_BLOCK: 0
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/phpunit ${{ (matrix.php == '8.4' && matrix.laravel == '13.*' && matrix.db == 'sqlite') && '--coverage-clover=coverage.xml' || '' }}

      - name: Upload coverage to Codecov
        if: matrix.php == '8.4' && matrix.laravel == '13.*' && matrix.db == 'sqlite'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
