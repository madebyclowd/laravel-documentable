name: run-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Code Styling Check (Pint)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-lint-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-lint-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run Pint
        run: vendor/bin/pint --test

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stability: [prefer-stable]
        # Full PHP x Laravel matrix runs on sqlite (fast). The uniqueness/
        # versioning logic (package-plan.md §5) is the part most likely to
        # silently pass on one engine and fail on another, so the latest
        # PHP/Laravel combo additionally runs against mysql and pgsql.
        include:
          - php: 8.2
            laravel: 11.*
            testbench: 9.*
            db: sqlite
          - php: 8.3
            laravel: 11.*
            testbench: 9.*
            db: sqlite
          - php: 8.3
            laravel: 12.*
            testbench: 10.*
            db: sqlite
          - php: 8.3
            laravel: 13.*
            testbench: 11.*
            db: sqlite
          - php: 8.4
            laravel: 11.*
            testbench: 9.*
            db: sqlite
          - php: 8.4
            laravel: 12.*
            testbench: 10.*
            db: sqlite
          - php: 8.4
            laravel: 13.*
            testbench: 11.*
            db: sqlite
          - php: 8.4
            laravel: 13.*
            testbench: 11.*
            db: mysql
          - php: 8.4
            laravel: 13.*
            testbench: 11.*
            db: pgsql

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.db }}

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: documentable_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        # Services always start; the DB_CONNECTION env below scopes which matrix
        # legs actually connect to it — inert otherwise.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: documentable_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_DATABASE: documentable_test
      DB_USERNAME: ${{ matrix.db == 'pgsql' && 'postgres' || 'root' }}
      DB_PASSWORD: ${{ matrix.db == 'pgsql' && 'postgres' || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, pdo_mysql, pdo_pgsql, bcmath, gd, exif, iconv
          coverage: none

      - name: Setup Problem Matchers
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.laravel }}-

      - name: Install dependencies
        env:
          COMPOSER_POLICY_ADVISORIES_BLOCK: 0
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/phpunit
